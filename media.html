<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de Média</title>
    <link rel="stylesheet" href="media.css">
</head>
<body>
    <div class="container">
    <h1>Calculadora de Média</h1>
    <p class="descricao"></p>
    <div class="campo">
    <label for="nota1">Primeira nota:</label>
    <input type="number" id="nota1" placeholder="Digite a primeira nota">
    </div>
    <div class="campo">
    <label for="nota2">Segunda nota:</label>
    <input type="number" id="nota2" placeholder="Digite a segunda nota">
    </div>
    <div class="campo">
    <label for="nota3">Primeira nota:</label>
    <input type="number" id="nota3" placeholder="Digite a terceira nota">
    </div>
    <button id="calcular"> Calcular média</button>
    <p id="resultado"></p>
    </div>
 <script src="media.js"></script>
</body>
</html>
